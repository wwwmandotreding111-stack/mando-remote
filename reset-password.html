<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تعيين كلمة مرور جديدة | MANDO REMOTE</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at top,#26364b,#080e18 70%);color:#f7f1e5;font-family:Tahoma,Arial,sans-serif}.card{width:min(100%,440px);padding:30px 24px;border:1px solid #b18a48;border-radius:22px;background:linear-gradient(145deg,#192a40,#0b1421);box-shadow:0 20px 60px #0009;text-align:center}h1{color:#f0d18e;font-size:25px;margin:0 0 10px}.sub{color:#c1cbd8;line-height:1.8;font-size:14px;margin-bottom:22px}input{width:100%;padding:15px;margin:8px 0;border-radius:12px;border:1px solid #526078;background:#070f1b;color:white;font-size:16px;text-align:center}button{width:100%;padding:14px;margin-top:12px;border:1px solid #ffe9b1;border-radius:12px;background:linear-gradient(110deg,#f8dfa0,#d8a94e);color:#17120a;font-size:17px;font-weight:bold}#msg{min-height:24px;color:#ffe2a0;line-height:1.7;margin-top:14px}a{color:#f0d18e}
</style>
</head>
<body>
<main class="card">
<div style="font-size:42px;margin-bottom:12px">🦅</div>
<h1>تعيين كلمة مرور جديدة</h1>
<p class="sub">شركة مندو التجارية — أدخل كلمة المرور الجديدة لحساب الإدارة.</p>
<form id="form" hidden>
<input id="password" type="password" minlength="8" autocomplete="new-password" placeholder="كلمة المرور الجديدة (8 أحرف على الأقل)" required>
<input id="confirm" type="password" minlength="8" autocomplete="new-password" placeholder="تأكيد كلمة المرور" required>
<button type="submit">حفظ كلمة المرور</button>
</form>
<p id="msg">جارٍ التحقق من رابط الاستعادة...</p>
<p><a href="./admin.html">العودة إلى صفحة الإدارة</a></p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const db=window.supabase.createClient("https://lhghepwcvlqazmpouidu.supabase.co","sb_publishable_EgAQZYow05AZT_pQqHkI2w_kxJff9B5",{auth:{flowType:"pkce",autoRefreshToken:true,persistSession:true,detectSessionInUrl:true}});
const form=document.getElementById("form"),msg=document.getElementById("msg");
(async()=>{
 try{
  const {data,error}=await db.auth.getSession();
  if(error)throw error;
  if(!data.session)throw new Error("رابط الاستعادة غير صالح أو منتهي الصلاحية. ارجع لصفحة الدخول واطلب رابطاً جديداً.");
  form.hidden=false;msg.textContent="تم التحقق من الرابط. أدخل كلمة المرور الجديدة.";
 }catch(e){msg.textContent=e.message||"تعذر التحقق من الرابط.";}
})();
form.addEventListener("submit",async e=>{
 e.preventDefault();
 const password=document.getElementById("password").value;
 const confirm=document.getElementById("confirm").value;
 if(password.length<8){msg.textContent="كلمة المرور يجب ألا تقل عن 8 أحرف.";return;}
 if(password!==confirm){msg.textContent="كلمتا المرور غير متطابقتين.";return;}
 msg.textContent="جارٍ حفظ كلمة المرور...";
 const {error}=await db.auth.updateUser({password});
 if(error){msg.textContent="تعذر تغيير كلمة المرور: "+error.message;return;}
 msg.textContent="تم تغيير كلمة المرور بنجاح. سيتم تحويلك إلى صفحة الإدارة...";
 form.hidden=true;
 await db.auth.signOut();
 setTimeout(()=>{location.href="./admin.html";},1800);
});
</script>
</body>
</html>
