</style></head><body><header><div class="eagle">🦅</div><h1>تطبيقات مندو</h1><p>MANDO APPS · تطبيقات مختارة وخفيفة</p></header><main><div class="top"><span class="muted">تحميل مباشر · بدون تعقيد</span><a href="customers.html">العودة للصفحة الرئيسية</a></div><section id="apps" class="grid"><div class="empty">جارٍ تحميل التطبيقات...</div></section><section id="admin" class="admin" hidden><h2>إضافة تطبيق جديد</h2><div class="row"><div><label>اسم التطبيق</label><input id="appName" maxlength="50" placeholder="مثال: Mando TV"></div><div><label>الإصدار</label><input id="appVersion" maxlength="20" placeholder="1.0"></div></div><label>وصف مختصر</label><textarea id="appDesc" rows="2" maxlength="180" placeholder="نبذة بسيطة عن التطبيق"></textarea><div class="row"><div><label>أيقونة التطبيق (اختياري)</label><input id="appIcon" type="file" accept="image/png,image/jpeg,image/webp"></div><div><label>ملف APK (حتى 30 ميغابايت)</label><input id="appFile" type="file" accept=".apk,application/vnd.android.package-archive"></div></div><button class="btn" id="uploadBtn" onclick="uploadApp()">رفع التطبيق</button><p id="status" class="status"></p><h2>إدارة التطبيقات</h2><div id="manage"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>

async function load(){const {data,error}=await db.from("mando_apps").select("*").eq("is_active",true).order("created_at",{ascending:false});if(error){$("apps").innerHTML='<div class="empty">قسم التطبيقات قيد الإعداد حالياً.</div>';return}apps=data||[];render()}

async function removeApp(id){if(!confirm("متأكد من حذف التطبيق؟"))return;const a=apps.find(x=>x.id===id);if(!a)return;const {error}=await db.from("mando_apps").delete().eq("id",id);if(error){$("status").textContent=error.message;return}if(a.file_path)await db.storage.from(bucket).remove([a.file_path]);await load()}
load();checkAdmin();
