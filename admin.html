<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>إدارة MANDO REMOTE</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at top,#20334c,#080d16 65%);font-family:Tahoma,Arial;color:#f5f5f5}.box{width:min(100%,430px);padding:28px;border:1px solid #9a7438;border-radius:22px;background:linear-gradient(145deg,#17263a,#0c1420);box-shadow:0 20px 60px #0008;text-align:center}.eagle{font-size:54px;color:#e6b957}h1{color:#e6b957;margin:8px 0}p{color:#aab5c5;font-size:13px}input{width:100%;padding:14px;margin:8px 0;border-radius:12px;border:1px solid #34465c;background:#091321;color:white;font-size:15px}button{width:100%;padding:14px;margin-top:10px;border:0;border-radius:12px;background:linear-gradient(135deg,#f0cd7d,#b78532);font-weight:bold;font-size:16px;color:#101722;cursor:pointer}#msg{min-height:24px;color:#ffd48a}
</style></head><body><main class="box"><div class="eagle">🦅</div><h1>MANDO REMOTE</h1><p>بوابة الإدارة الخاصة — شركة مندو التجارية</p><input id="user" placeholder="اسم المستخدم أو البريد" autocomplete="username"><input id="pass" type="password" placeholder="كلمة المرور" autocomplete="current-password"><button id="go">دخول الإدارة</button><button id="forgot" type="button" style="background:transparent;border:1px solid #9a7438;color:#f0cd7d;font-size:14px;margin-top:8px">نسيت كلمة المرور؟</button><div id="msg"></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=window.supabase.createClient("https://lhghepwcvlqazmpouidu.supabase.co","sb_publishable_EgAQZYow05AZT_pQqHkI2w_kxJff9B");
document.getElementById("forgot").onclick=async()=>{const msg=document.getElementById("msg");const v=document.getElementById("user").value.trim().toLowerCase();if(!v.includes("@")){msg.textContent="اكتب بريدك الإلكتروني الكامل أولاً.";return;}msg.textContent="جارٍ إرسال رابط الاستعادة...";const {error}=await db.auth.resetPasswordForEmail(v,{redirectTo:"https://wwwmandotreding111-stack.github.io/mando-remote/reset-password.html"});msg.textContent=error?("خطأ من خدمة البريد: "+(error.message||"تعذر إرسال الرابط")):"إذا كان البريد مسجلاً، رح يوصلك رابط استعادة كلمة المرور.";};
document.getElementById("go").onclick=async()=>{const msg=document.getElementById("msg");msg.textContent="جارٍ التحقق...";const v=document.getElementById("user").value.trim().toLowerCase();const email=v.includes("@")?v:v+"@users.mando.local";const {error}=await db.auth.signInWithPassword({email,password:document.getElementById("pass").value});if(error){msg.textContent="بيانات الدخول غير صحيحة.";return;}const {data, error:e}=await db.rpc("is_admin");if(e||data!==true){await db.auth.signOut();msg.textContent="هذا الحساب ليس لديه صلاحية الإدارة.";return;}location.href="./";};
</script></body></html>
